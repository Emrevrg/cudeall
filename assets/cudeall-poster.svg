  <text x="84" y="268" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="750" letter-spacing="-5">Cude<tspan fill="#5eead4">All</tspan></text>
  <text x="92" y="328" fill="#d4e1eb" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="500">Build together. Keep work moving.</text>
  <text x="92" y="374" fill="#8fa4b8" font-family="Segoe UI, Arial, sans-serif" font-size="20">A shared project spine for coding agents.</text>
  <g transform="translate(540 720)">
    <path d="M0 262V92M0 92L-182-33M0 92L182-33M0 92V-125M-182-33L-300-122M-182-33L-92-155M182-33L95-157M182-33L302-122M0-125L-56-210M0-125L78-220" fill="none" stroke="url(#beam)" stroke-opacity=".72" stroke-width="4"/>
    <g fill="#0c1b29" stroke="#5eead4" stroke-width="3"><circle r="47"/><circle cx="-182" cy="-33" r="34"/><circle cx="182" cy="-33" r="34"/><circle cy="-125" r="34"/><circle cx="-300" cy="-122" r="23"/><circle cx="-92" cy="-155" r="23"/><circle cx="95" cy="-157" r="23"/><circle cx="302" cy="-122" r="23"/><circle cx="-56" cy="-210" r="23"/><circle cx="78" cy="-220" r="23"/></g>
    <g fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text y="5">SPINE</text><text x="-182" y="-28">TASKS</text><text x="182" y="-28">PROOF</text><text y="-120">CONTEXT</text></g>
    <g fill="#bfd0df" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600"><text x="-372" y="-126">OpenCode</text><text x="-108" y="-190">Codex</text><text x="55" y="-193">Claude</text><text x="310" y="-127">Desktop</text></g>
