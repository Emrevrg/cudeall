<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">CudeAll — Build together. Keep work moving.</title>
  <desc id="desc">A portrait launch poster for the local-first shared workflow that connects coding agents through context, tasks, evidence, and handoffs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#07111d"/><stop offset=".62" stop-color="#0b1827"/><stop offset="1" stop-color="#101d2a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset=".55" stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#34d399" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1080" height="1350" rx="34" fill="url(#bg)"/><rect width="1080" height="1350" rx="34" fill="url(#grid)"/>
  <circle cx="545" cy="805" r="390" fill="url(#glow)"/>
