    <g><rect width="180" height="48" rx="24" fill="#122436" stroke="#253b4f"/><text x="90" y="31" fill="#d9e7f2" text-anchor="middle">Shared context</text></g>
    <g transform="translate(198)"><rect width="180" height="48" rx="24" fill="#122436" stroke="#253b4f"/><text x="90" y="31" fill="#d9e7f2" text-anchor="middle">Verifiable work</text></g>
    <g transform="translate(396)"><rect width="180" height="48" rx="24" fill="#122436" stroke="#253b4f"/><text x="90" y="31" fill="#d9e7f2" text-anchor="middle">Seamless handoffs</text></g>
  </g>
  <path d="M92 1165H988" stroke="#203447"/>
  <text x="92" y="1212" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">CONTEXT  →  TASKS  →  EVIDENCE  →  HANDOFF</text>
